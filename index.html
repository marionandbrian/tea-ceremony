<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea Ceremony</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&family=Meow+Script&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.8;
            color: #3d3d3d;
            background-color: #f7f2ee;
            font-size: 16px;
        }

        header {
            background-color: #f7f2ee;
            padding: 40px 20px 25px 20px;
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .header-top {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-family: 'Meow Script', cursive;
            font-size: 64px;
            font-weight: 400;
            color: #8b0000;
            margin: 0;
            line-height: 1.1;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 6px;
            background: none;
            border: none;
            padding: 0;
            position: absolute;
            right: 20px;
            top: 15px;
        }

        .hamburger span {
            width: 25px;
            height: 2.5px;
            background-color: #8b0000;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(10px, 10px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        nav a {
            color: #8b0000;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            transition: opacity 0.3s ease;
            text-transform: uppercase;
        }

        nav a:hover {
            opacity: 0.6;
        }

        nav.mobile-hidden {
            display: none;
        }

        nav.mobile-open {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #f7f2ee;
            padding: 20px;
            gap: 15px;
            z-index: 1000;
            margin-top: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 20px 60px 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 50px;
        }

        .sub-header-tag {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8b0000;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 52px;
            color: #8b0000;
            margin-bottom: 15px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .event-image {
            max-width: 40%;
            height: auto;
            display: block;
            margin: 20px auto 20px auto;
        }

        .hero p {
            font-size: 18px;
            color: #5a5a5a;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .hero .date {
            font-size: 20px;
            color: #8b0000;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .rsvp-section {
            text-align: center;
            padding: 50px 30px;
            background-color: #8b0000;
            color: #f7f2ee;
            border-radius: 4px;
            margin: 40px 0;
        }

        .rsvp-section h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            margin-bottom: 10px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .rsvp-section p {
            font-size: 16px;
            margin-bottom: 25px;
            opacity: 0.9;
            font-weight: 300;
        }

        .rsvp-button {
            background: #f7f2ee;
            color: #8b0000;
            border: 2px solid #f7f2ee;
            padding: 14px 40px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .rsvp-button:hover {
            background: transparent;
            color: #f7f2ee;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            header {
              padding: 40px 20px 20px 20px; text-align: center; }
            }

            .header-top {
                justify-content: center;
                width: 100%;
            }

            .logo {
                font-size: 44px;
                margin: 0;
                text-align: center;
            }

            .hamburger {
                display: none !important;
            }

            nav {
                display: flex !important;
                flex-wrap: nowrap;
                justify-content: center;
                gap: 12px;
                margin-top: 15px;
            }

            nav a {
                font-size: 11px;
                letter-spacing: 1px;
                white-space: nowrap;
            }

            .container {
                padding: 15px 15px 40px 15px;
            }

            .hero {
                margin-bottom: 30px;
            }

            .sub-header-tag {
                font-size: 12px;
                letter-spacing: 2px;
            }

            .hero h1 {
                font-size: 28px;
                margin-bottom: 10px;
            }

            .hero p {
                font-size: 14px;
                margin-bottom: 15px;
            }

            .hero .date {
                font-size: 14px;
            }

            .event-image {
                max-width: 70%;
            }

            .rsvp-section {
                padding: 30px 20px;
                margin: 30px 0;
                border-radius: 0;
            }

            .rsvp-section h2 {
                font-size: 28px;
                margin-bottom: 8px;
            }

            .rsvp-section p {
                font-size: 14px;
                margin-bottom: 20px;
            }

            .rsvp-button {
                padding: 12px 30px;
                font-size: 12px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo">Marion & Brian</div>
        </div>
        <nav id="mobileNav">
            <a href="venue.html">Venue</a>
            <a href="schedule.html">Schedule</a>
            <a href="dress-code.html">Dress Code</a>
            <a href="rsvp.html">RSVP</a>
        </nav>
    </header>

    <div class="container">
        <div class="hero">
            <div class="sub-header-tag">You are invited to the</div>
            <h1>Tea Ceremony</h1>
            <div class="date">24TH OCTOBER 2026 • 4:00 PM</div>
            <p>Join us for a celebration of love, family, and tradition</p>
            <img src="doublel.png" class="event-image" alt="Tea Ceremony Illustration">
        </div>

        <div class="rsvp-section">
            <h2>We'd Love to See You!</h2>
            <p>Please let us know if you can attend</p>
            <a href="rsvp.html" class="rsvp-button">RSVP NOW</a>
        </div>
    </div>
</body>
</html>
