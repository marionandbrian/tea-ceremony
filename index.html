<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marion & Brian - Tea Ceremony</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&family=Meow+Script&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.8;
            color: #3d3d3d;
            background-color: #f7f2ee;
            font-size: 16px;
        }

        header {
            background-color: #f7f2ee;
            padding: 40px 20px 25px 20px;
            text-align: center;
        }

        .logo {
            font-family: 'Meow Script', cursive;
            font-size: 64px;
            font-weight: 400;
            color: #8b0000;
            margin-bottom: 25px;
            line-height: 1.1;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        nav a {
            color: #8b0000;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            transition: opacity 0.3s ease;
            text-transform: uppercase;
        }

        nav a:hover {
            opacity: 0.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 20px 60px 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 50px;
        }

        .sub-header-tag {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8b0000;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 52px;
            color: #8b0000;
            margin-bottom: 15px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 18px;
            color: #5a5a5a;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .hero .date {
            font-size: 20px;
            color: #8b0000;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .event-image {
            max-width: 50%;
            height: auto;
            display: block;
            margin: 20px auto 0 auto;
        }

        .rsvp-section {
            text-align: center;
            padding: 50px 30px;
            background-color: #8b0000;
            color: #f7f2ee;
            border-radius: 4px;
            margin: 40px 0;
        }

        .rsvp-section h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            margin-bottom: 10px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .rsvp-section p {
            font-size: 16px;
            margin-bottom: 25px;
            opacity: 0.9;
            font-weight: 300;
        }

        .rsvp-button {
            background: #f7f2ee;
            color: #8b0000;
            border: 2px solid #f7f2ee;
            padding: 14px 40px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .rsvp-button:hover {
            background: transparent;
            color: #f7f2ee;
        }

        /* Mobile Adjustments (Keeps Desktop Unchanged) */
        @media (max-width: 768px) {
            header {
                padding: 25px 15px 15px 15px;
            }

            .logo {
                font-size: 46px;
                margin-bottom: 15px;
            }

            nav {
                gap: 10px;
            }

            nav a {
                font-size: 12px;
                padding: 6px 10px;
                letter-spacing: 1px;
            }

            .container {
                padding: 10px 15px 40px 15px;
            }

            .hero {
                margin-bottom: 30px;
            }

            .sub-header-tag {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .hero p {
                font-size: 15px;
            }

            .hero .date {
                font-size: 16px;
            }

            .event-image {
                max-width: 80%;
            }

            .rsvp-section {
                padding: 35px 20px;
                margin: 30px 0;
            }

            .rsvp-section h2 {
                font-size: 32px;
            }

            .rsvp-button {
                padding: 12px 30px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Marion & Brian</div>
        <nav>
            <a href="venue.html">Venue</a>
            <a href="schedule.html">Schedule</a>
            <a href="dress-code.html">Dress Code</a>
            <a href="rsvp.html">RSVP</a>
        </nav>
    </header>

    <div class="container">
        <div class="hero">
            <div class="sub-header-tag">You are invited to the</div>
            <h1>Tea Ceremony</h1>
            <p>Join us for a celebration of love, family, and tradition</p>
            <div class="date">24TH OCTOBER 2026 • 4:00 PM</div>
        </div>

        <img src="doublel.png" class="event-image" alt="Tea Ceremony Illustration">

        <div class="rsvp-section">
            <h2>We'd Love to See You!</h2>
            <p>Please let us know if you can attend</p>
            <a href="rsvp.html" class="rsvp-button">RSVP NOW</a>
        </div>
    </div>
</body>
</html>
