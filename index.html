<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marion & Brian - Tea Ceremony</title>
    <!-- Fonts matching the postcard style: Meow Script for names, Montserrat & Cormorant Garamond for text -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&family=Meow+Script&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.8;
            color: #3d3d3d;
            background-color: #f7f2ee; /* Match postcard light beige background */
            font-size: 16px;
        }

        header {
            background-color: #f7f2ee;
            padding: 40px 20px 25px 20px;
            text-align: center;
        }

        /* Using Meow Script for Marion & Brian */
        .logo {
            font-family: 'Meow Script', cursive;
            font-size: 64px;
            font-weight: 400;
            color: #8b0000; /* Rich crimson red matching postcard line art */
            margin-bottom: 25px;
            line-height: 1.1;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        nav a {
            color: #8b0000;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            transition: opacity 0.3s ease;
            text-transform: uppercase;
        }

        nav a:hover {
            opacity: 0.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 20px 60px 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 50px;
        }

        .sub-header-tag {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #8b0000;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 52px;
            color: #8b0000;
            margin-bottom: 15px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 18px;
            color: #5a5a5a;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .hero .date {
            font-size: 20px;
            color: #8b0000;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .photo-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .photo {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #8b0000;
            margin: 0 auto;
        }

        .rsvp-section {
            text-align: center;
            padding: 50px 30px;
            background-color: #8b0000;
            color: #f7f2ee;
            border-radius: 4px;
            margin: 40px 0;
        }

        .rsvp-section h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 42px;
            margin-bottom: 10px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .rsvp-section p {
            font-size: 16px;
            margin-bottom: 25px;
            opacity: 0.9;
            font-weight: 300;
        }

        .rsvp-button {
            background: #f7f2ee;
            color: #8b0000;
            border: 2px solid #f7f2ee;
            padding: 14px 40px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .rsvp-button:hover {
            background: transparent;
            color: #f7f2ee;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 52px;
            }

            .hero h1 {
                font-size: 40px;
            }

            nav {
                gap: 15px;
            }

            nav a {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Marion & Brian</div>
        <nav>
            <a href="venue.html">Venue</a>
            <a href="schedule.html">Schedule</a>
            <a href="dress-code.html">Dress Code</a>
            <a href="rsvp.html">RSVP</a>
        </nav>
    </header>

    <div class="container">
        <div class="hero">
            <div class="sub-header-tag">You are invited to the</div>
            <h1>Tea Ceremony</h1>
            <p>Join us for a celebration of love, family, and tradition</p>
            <div class="date">24TH OCTOBER 2026 • 4:00 PM</div>
        </div>

        <div class="photo-section">
            <img src="https://github.com/marionandbrian/tea-ceremony/blob/879714058b3861a7aebe7b8efd49388ad20bd232/doodle.png" alt="Marion and Brian" class="photo">
        </div>

        <div class="rsvp-section">
            <h2>We'd Love to See You</h2>
            <p>Please let us know if you can attend</p>
            <p style="font-size: 15px; margin-bottom: 25px; letter-spacing: 1px;"><strong>RSVP BY SEPTEMBER 23RD, 2026</strong></p>
            <a href="rsvp.html" class="rsvp-button">RSVP NOW</a>
        </div>
    </div>
</body>
</html>
