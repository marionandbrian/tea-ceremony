<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Marion & Brian</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&family=Meow+Script&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; color: #3d3d3d; background-color: #f7f2ee; line-height: 1.8; }
        header { padding: 40px 20px 20px 20px; text-align: center; }
        .logo { font-family: 'Meow Script', cursive; font-size: 56px; color: #8b0000; text-decoration: none; }
        nav { display: flex; justify-content: center; gap: 30px; margin-top: 15px; flex-wrap: wrap; }
        nav a { color: #8b0000; text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 42px; color: #8b0000; margin-bottom: 40px; text-align: center; font-weight: 400; }
        .event-item { margin-bottom: 40px; padding-bottom: 30px; border-bottom: 1px solid #e2d7cd; }
        .event-item:last-child { border-bottom: none; }
        .time { font-weight: 600; color: #8b0000; font-size: 18px; letter-spacing: 1px; }
        .title { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: #8b0000; margin: 5px 0 10px 0; }
        .description { font-size: 15px; color: #5a5a5a; font-weight: 300; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Marion & Brian</a>
        <nav>
            <a href="venue.html">Venue</a>
            <a href="schedule.html" style="text-decoration: underline;">Schedule</a>
            <a href="dress-code.html">Dress Code</a>
            <a href="rsvp.html">RSVP</a>
        </nav>
    </header>

    </header>

    <div class="container">
        <a href="index.html" class="back-link">← Back to Event</a>

        <div class="form-container">
            <div class="success-message" id="successMessage">
                ✓ Thank you! Your RSVP has been received.
            </div>

            <h1>RSVP</h1>
            <p>We'd love to confirm your attendance</p>

            <form id="rsvpForm">
                <div class="form-group">
                    <label for="firstName">First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" name="firstName" required>
                    <div class="error-message" id="firstNameError">Please enter your first name</div>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" name="lastName" required>
                    <div class="error-message" id="lastNameError">Please enter your last name</div>
                </div>

                <div class="form-group">
                    <label>Will you be attending? <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="attending" name="attending" value="yes" required>
                            <label for="attending">Yes, I will attend</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="notAttending" name="attending" value="no" required>
                            <label for="notAttending">No, I cannot attend</label>
                        </div>
                    </div>
                    <div class="error-message" id="attendingError">Please select your attendance</div>
                </div>

                <div class="form-group">
                    <label for="diet">Dietary Restrictions</label>
                    <select id="diet" name="diet">
                        <option value="none">None</option>
                        <option value="vegan">Vegan</option>
                        <option value="vegetarian">Vegetarian</option>
                        <option value="other">Other (please specify)</option>
                    </select>
                </div>

                <div class="form-group" id="otherDietGroup" style="display: none;">
                    <label for="otherDiet">Please specify your dietary restrictions</label>
                    <textarea id="otherDiet" name="otherDiet" placeholder="e.g., gluten-free, allergies, etc."></textarea>
                </div>

                <div class="form-group">
                    <label for="specialRequests">Special Requests or Notes</label>
                    <textarea id="specialRequests" name="specialRequests" placeholder="Any other information you'd like to share?"></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit RSVP</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('rsvpForm');
        const dietSelect = document.getElementById('diet');
        const otherDietGroup = document.getElementById('otherDietGroup');
        const successMessage = document.getElementById('successMessage');

        dietSelect.addEventListener('change', function() {
            if (this.value === 'other') {
                otherDietGroup.style.display = 'block';
            } else {
                otherDietGroup.style.display = 'none';
            }
        });

        const inputs = form.querySelectorAll('input[type="text"], textarea');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                this.closest('.form-group').classList.remove('error');
                const errorDiv = this.closest('.form-group').querySelector('.error-message');
                if (errorDiv) {
                    errorDiv.classList.remove('show');
                }
            });
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            document.querySelectorAll('.form-group').forEach(group => {
                group.classList.remove('error');
            });
            document.querySelectorAll('.error-message').forEach(msg => {
                msg.classList.remove('show');
            });

            let isValid = true;
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const attending = document.querySelector('input[name="attending"]:checked');

            if (!firstName) {
                showError('firstName', 'firstNameError');
                isValid = false;
            }

            if (!lastName) {
                showError('lastName', 'lastNameError');
                isValid = false;
            }

            if (!attending) {
                document.getElementById('attendingError').classList.add('show');
                isValid = false;
            }

            if (!isValid) {
                return;
            }

            const formData = {
                firstName: firstName,
                lastName: lastName,
                attending: attending.value,
                diet: document.getElementById('diet').value,
                otherDiet: document.getElementById('otherDiet').value,
                specialRequests: document.getElementById('specialRequests').value,
                timestamp: new Date().toLocaleString()
            };

            const existingData = JSON.parse(localStorage.getItem('rsvpSubmissions') || '[]');
            existingData.push(formData);
            localStorage.setItem('rsvpSubmissions', JSON.stringify(existingData));

            successMessage.classList.add('show');
            form.style.display = 'none';

            setTimeout(() => {
                form.reset();
                form.style.display = 'block';
                successMessage.classList.remove('show');
                document.getElementById('diet').value = 'none';
                otherDietGroup.style.display = 'none';
            }, 3000);
        });

        function showError(inputId, errorId) {
            document.getElementById(inputId).closest('.form-group').classList.add('error');
            document.getElementById(errorId).classList.add('show');
        }
    </script>
</body>
</html>
