    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; color: #3d3d3d; background-color: #f7f2ee; line-height: 1.8; }

        /* Boxed Form Styling */
        .form-container {
            background-color: #ffffff;
            border: 1px solid #e2d7cd;
            border-radius: 8px;
            padding: 30px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            text-align: center;
        }

        .form-container h1 { 
            font-family: 'Cormorant Garamond', serif;

            font-weight: 400; 
        }

        .form-subtitle {
            font-size: 20px;
            color: #8b0000; 
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* Wrapper expanded so the full form renders without an internal scrollbar */
        .iframe-wrapper {
            position: relative;
            width: 100%;
            height: 1000px; /* Tall enough to display all questions fully */
            overflow: hidden;
        }

        /* Shifted further up to crop out both the header and email box completely */
        .iframe-wrapper iframe {
            position: absolute;
            top: -200px; /* Adjust slightly up/down if you want to fine-tune where the crop starts */
            left: 0;
            width: 100%;
            height: calc(100% + 260px);
            border: none; 
        }

        .iframe-wrapper {
    height: 700px;       /* 1. CROPS BOTTOM (Smaller number = cuts off more at the bottom) */
    overflow: hidden;    /* Required to hide the overflow */
    position: relative;
}
