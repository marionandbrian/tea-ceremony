<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Marion & Brian's Tea Ceremony</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            line-height: 1.8;
            color: #3d3d3d;
            background-color: #f9f7f4;
            font-size: 18px;
        }

        header {
            background-color: #f9f7f4;
            padding: 40px 20px 25px 20px;
            text-align: center;
            border-bottom: 1px solid #e8e3dd;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .logo {
            font-family: 'Meow Script', cursive;
            font-size: 48px;
            font-weight: 400;
            color: #a52a2a;
            margin-bottom: 25px;
            letter-spacing: 0;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        nav a {
            color: #a52a2a;
            text-decoration: none;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
            text-transform: uppercase;
        }

        nav a:hover {
            opacity: 0.7;
        }

        nav a.active {
            border-bottom: 2px solid #a52a2a;
            padding-bottom: 5px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: #a52a2a;
            text-decoration: none;
            font-weight: 400;
            transition: opacity 0.3s ease;
            letter-spacing: 1px;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .form-container {
            background: #fefdfb;
            padding: 50px 40px;
            border-radius: 0;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        .form-container h1 {
            color: #a52a2a;
            margin-bottom: 10px;
            font-size: 48px;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
        }

        .form-container p {
            color: #6b6b6b;
            margin-bottom: 35px;
            font-size: 18px;
            text-align: center;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #3d3d3d;
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .required {
            color: #a52a2a;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #d4cfc7;
            border-radius: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            background-color: #fefdfb;
            transition: border-color 0.3s ease;
            color: #3d3d3d;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #a52a2a;
            background-color: #faf8f4;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Cormorant Garamond', serif;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .radio-option {
            display: flex;
            align-items: center;
        }

        input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #a52a2a;
        }

        .radio-option label {
            margin: 0;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 18px;
        }

        .submit-btn {
            background: #a52a2a;
            color: #f9f7f4;
            border: 2px solid #a52a2a;
            padding: 14px 50px;
            font-size: 16px;
            border-radius: 0;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            letter-spacing: 1px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            background: #f9f7f4;
            color: #a52a2a;
            border-color: #a52a2a;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-message {
            display: none;
            background: #f0ebe4;
            color: #a52a2a;
            padding: 25px;
            border-radius: 0;
            border: 1px solid #d4cfc7;
            margin-bottom: 25px;
            text-align: center;
            font-size: 18px;
            font-weight: 400;
        }

        .success-message.show {
            display: block;
        }

        .error-message {
            color: #a52a2a;
            font-size: 14px;
            margin-top: 6px;
            display: none;
            font-weight: 400;
        }

        .error-message.show {
            display: block;
        }

        .form-group.error input,
        .form-group.error select {
            border-color: #a52a2a;
            background-color: #faf8f4;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 40px 25px;
            }

            .form-container h1 {
                font-size: 36px;
            }

            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">Marion & Brian</div>
            <nav>
                <a href="index.html">Home</a>
                <a href="venue.html">Venue</a>
                <a href="schedule.html">Schedule</a>
                <a href="rsvp.html" class="active">RSVP</a>
                <a href="dress-code.html">Dress Code</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <a href="index.html" class="back-link">← Back to Event</a>

        <div class="form-container">
            <div class="success-message" id="successMessage">
                ✓ Thank you! Your RSVP has been received.
            </div>

            <h1>RSVP</h1>
            <p>We'd love to confirm your attendance</p>

            <form id="rsvpForm">
                <div class="form-group">
                    <label for="firstName">First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" name="firstName" required>
                    <div class="error-message" id="firstNameError">Please enter your first name</div>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" name="lastName" required>
                    <div class="error-message" id="lastNameError">Please enter your last name</div>
                </div>

                <div class="form-group">
                    <label>Will you be attending? <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="attending" name="attending" value="yes" required>
                            <label for="attending">Yes, I will attend</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="notAttending" name="attending" value="no" required>
                            <label for="notAttending">No, I cannot attend</label>
                        </div>
                    </div>
                    <div class="error-message" id="attendingError">Please select your attendance</div>
                </div>

                <div class="form-group">
                    <label for="diet">Dietary Restrictions</label>
                    <select id="diet" name="diet">
                        <option value="none">None</option>
                        <option value="vegan">Vegan</option>
                        <option value="vegetarian">Vegetarian</option>
                        <option value="other">Other (please specify)</option>
                    </select>
                </div>

                <div class="form-group" id="otherDietGroup" style="display: none;">
                    <label for="otherDiet">Please specify your dietary restrictions</label>
                    <textarea id="otherDiet" name="otherDiet" placeholder="e.g., gluten-free, allergies, etc."></textarea>
                </div>

                <div class="form-group">
                    <label for="specialRequests">Special Requests or Notes</label>
                    <textarea id="specialRequests" name="specialRequests" placeholder="Any other information you'd like to share?"></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit RSVP</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('rsvpForm');
        const dietSelect = document.getElementById('diet');
        const otherDietGroup = document.getElementById('otherDietGroup');
        const successMessage = document.getElementById('successMessage');

        dietSelect.addEventListener('change', function() {
            if (this.value === 'other') {
                otherDietGroup.style.display = 'block';
            } else {
                otherDietGroup.style.display = 'none';
            }
        });

        const inputs = form.querySelectorAll('input[type="text"], textarea');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                this.closest('.form-group').classList.remove('error');
                const errorDiv = this.closest('.form-group').querySelector('.error-message');
                if (errorDiv) {
                    errorDiv.classList.remove('show');
                }
            });
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            document.querySelectorAll('.form-group').forEach(group => {
                group.classList.remove('error');
            });
            document.querySelectorAll('.error-message').forEach(msg => {
                msg.classList.remove('show');
            });

            let isValid = true;
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const attending = document.querySelector('input[name="attending"]:checked');

            if (!firstName) {
                showError('firstName', 'firstNameError');
                isValid = false;
            }

            if (!lastName) {
                showError('lastName', 'lastNameError');
                isValid = false;
            }

            if (!attending) {
                document.getElementById('attendingError').classList.add('show');
                isValid = false;
            }

            if (!isValid) {
                return;
            }

            const formData = {
                firstName: firstName,
                lastName: lastName,
                attending: attending.value,
                diet: document.getElementById('diet').value,
                otherDiet: document.getElementById('otherDiet').value,
                specialRequests: document.getElementById('specialRequests').value,
                timestamp: new Date().toLocaleString()
            };

            const existingData = JSON.parse(localStorage.getItem('rsvpSubmissions') || '[]');
            existingData.push(formData);
            localStorage.setItem('rsvpSubmissions', JSON.stringify(existingData));

            successMessage.classList.add('show');
            form.style.display = 'none';

            setTimeout(() => {
                form.reset();
                form.style.display = 'block';
                successMessage.classList.remove('show');
                document.getElementById('diet').value = 'none';
                otherDietGroup.style.display = 'none';
            }, 3000);
        });

        function showError(inputId, errorId) {
            document.getElementById(inputId).closest('.form-group').classList.add('error');
            document.getElementById(errorId).classList.add('show');
        }
    </script>
</body>
</html>
