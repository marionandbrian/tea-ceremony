<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Marion & Brian</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&family=Meow+Script&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; color: #3d3d3d; background-color: #f7f2ee; line-height: 1.8; }
        header { padding: 40px 20px 20px 20px; text-align: center; }
        .logo { font-family: 'Meow Script', cursive; font-size: 56px; color: #8b0000; text-decoration: none; }
        nav { display: flex; justify-content: center; gap: 30px; margin-top: 15px; flex-wrap: wrap; }
        nav a { color: #8b0000; text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; }
        
        .container { max-width: 650px; margin: 0 auto; padding: 20px 20px 60px 20px; }
        
        .back-link { 
            display: inline-block; 
            color: #8b0000; 
            text-decoration: none; 
            font-size: 13px; 
            letter-spacing: 1px; 
            margin-bottom: 25px; 
            text-transform: uppercase;
        }

        /* Boxed Form Styling */
        .form-container {
            background-color: #ffffff;
            border: 1px solid #e2d7cd;
            border-radius: 8px;
            padding: 40px 35px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            text-align: center;
        }

        .form-container h1 { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 38px; 
            color: #8b0000; 
            margin-bottom: 5px; 
            font-weight: 400; 
        }

        .form-subtitle {
            font-size: 14px;
            color: #7a7a7a;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #8b0000;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .required { color: #b23b3b; }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e2d7cd;
            border-radius: 4px;
            background-color: #faf8f5;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #3d3d3d;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: #8b0000;
            background-color: #ffffff;
        }

        textarea { resize: vertical; min-height: 90px; }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-option label {
            text-transform: none;
            letter-spacing: 0;
            font-weight: 400;
            color: #3d3d3d;
            margin-bottom: 0;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            accent-color: #8b0000;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #8b0000;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #6a0000;
        }

        /* Error and Success States */
        .error-message {
            color: #b23b3b;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show { display: block; }

        .form-group.error input, 
        .form-group.error select, 
        .form-group.error textarea {
            border-color: #b23b3b;
        }

        .success-message {
            display: none;
            background-color: #eaf4eb;
            color: #2e6930;
            border: 1px solid #c8e6c9;
            padding: 15px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .success-message.show { display: block; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Marion & Brian</a>
        <nav>
            <a href="venue.html">Venue</a>
            <a href="schedule.html">Schedule</a>
            <a href="dress-code.html">Dress Code</a>
            <a href="rsvp.html" style="text-decoration: underline;">RSVP</a>
        </nav>
    </header>

    <div class="container">
        <a href="index.html" class="back-link">← Back to Event</a>

        <div class="form-container">
            <div class="success-message" id="successMessage">
                ✓ Thank you! Your RSVP has been received.
            </div>

            <h1>RSVP</h1>
            <p class="form-subtitle">We'd love to confirm your attendance</p>

    <script>
        const form = document.getElementById('rsvpForm');
        const dietSelect = document.getElementById('diet');
        const otherDietGroup = document.getElementById('otherDietGroup');
        const successMessage = document.getElementById('successMessage');

        dietSelect.addEventListener('change', function() {
            if (this.value === 'other') {
                otherDietGroup.style.display = 'block';
            } else {
                otherDietGroup.style.display = 'none';
            }
        });

        const inputs = form.querySelectorAll('input[type="text"], textarea');
        inputs.forEach(input => {
            input.addEventListener('input', function() {
                this.closest('.form-group').classList.remove('error');
                const errorDiv = this.closest('.form-group').querySelector('.error-message');
                if (errorDiv) {
                    errorDiv.classList.remove('show');
                }
            });
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            document.querySelectorAll('.form-group').forEach(group => {
                group.classList.remove('error');
            });
            document.querySelectorAll('.error-message').forEach(msg => {
                msg.classList.remove('show');
            });

            let isValid = true;
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const attending = document.querySelector('input[name="attending"]:checked');

            if (!firstName) {
                showError('firstName', 'firstNameError');
                isValid = false;
            }

            if (!lastName) {
                showError('lastName', 'lastNameError');
                isValid = false;
            }

            if (!attending) {
                document.getElementById('attendingError').classList.add('show');
                isValid = false;
            }

            if (!isValid) {
                return;
            }

            const formData = {
                firstName: firstName,
                lastName: lastName,
                attending: attending.value,
                diet: document.getElementById('diet').value,
                otherDiet: document.getElementById('otherDiet').value,
                specialRequests: document.getElementById('specialRequests').value,
                timestamp: new Date().toLocaleString()
            };

            // Saves locally in visitor's browser (See instructions below to send email/sheets)
            const existingData = JSON.parse(localStorage.getItem('rsvpSubmissions') || '[]');
            existingData.push(formData);
            localStorage.setItem('rsvpSubmissions', JSON.stringify(existingData));

            successMessage.classList.add('show');
            form.style.display = 'none';

            setTimeout(() => {
                form.reset();
                form.style.display = 'block';
                successMessage.classList.remove('show');
                document.getElementById('diet').value = 'none';
                otherDietGroup.style.display = 'none';
            }, 5000);
        });

        function showError(inputId, errorId) {
            document.getElementById(inputId).closest('.form-group').classList.add('error');
            document.getElementById(errorId).classList.add('show');
        }
    </script>
